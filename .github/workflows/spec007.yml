name: Spec 007 Java worker
on:
  pull_request:
    paths: ["vertx-pull-worker/**", "compose.spec007.yaml", "infra/spec007/**", "scripts/spec007*", ".github/workflows/spec007.yml"]
  push:
    paths: ["vertx-pull-worker/**", "compose.spec007.yaml", "infra/spec007/**", "scripts/spec007*", ".github/workflows/spec007.yml"]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
jobs:
  kafka-and-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: docker compose up -d --wait kafka
      - run: mvn -B -f vertx-pull-worker/pom.xml clean verify -Pkafka
      - run: mvn -B -f vertx-pull-worker/pom.xml verify -Pkafka,capacity -Dit.test=KafkaCapacityIT
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      - run: docker build -t spec007-worker:local vertx-pull-worker
      - run: docker compose -f compose.yaml -f compose.spec007.yaml --profile spec007-baseline config --quiet
      - name: Local container kill and recovery
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install 'confluent-kafka>=2.11,<3'
          docker compose -f compose.yaml -f compose.spec007.yaml --profile spec007-baseline up -d --wait spec007-subscriber-0 spec007-subscriber-1 spec007-subscriber-2 spec007-subscriber-3 spec007-subscriber-4 spec007-demo
          scripts/spec007 chaos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec007-evidence
          path: |
            vertx-pull-worker/target/surefire-reports
            vertx-pull-worker/target/failsafe-reports
            vertx-pull-worker/target/capacity-evidence
