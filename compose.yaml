name: job-visibility

services:
  scheduler-postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-local
    ports:
      - "5432:5432"
    volumes:
      - scheduler-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/scheduler-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  edr-postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-local
    ports:
      - "5433:5432"
    volumes:
      - edr-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/edr-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.9.2
    hostname: kafka
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20

  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.2
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka-connect:
    build:
      context: ./infra/kafka/connect
    depends_on:
      edr-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_GROUP_ID: job-visibility-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.json.JsonSchemaConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
      EDR_DATABASE_URL: jdbc:postgresql://edr-postgres:5432/edr
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  cassandra:
    image: cassandra:5.0.5
    environment:
      CASSANDRA_CLUSTER_NAME: job-visibility-local
      CASSANDRA_ENDPOINT_SNITCH: SimpleSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra-data:/var/lib/cassandra
      - ./infra/cassandra:/setup:ro
    entrypoint: ["bash", "/setup/entrypoint.sh"]
    command: ["cassandra", "-f"]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -u cassandra -p cassandra -e 'SELECT release_version FROM system.local' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 30

  kafka-setup:
    image: confluentinc/cp-kafka:7.9.2
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    volumes:
      - ./infra/kafka:/setup:ro
    entrypoint: ["bash", "/setup/setup.sh"]

  cassandra-setup:
    image: cassandra:5.0.5
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./infra/cassandra:/setup:ro
    entrypoint: ["bash", "/setup/setup.sh"]

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - "8474:8474"
      - "9042:9042"
      - "15432:15432"
      - "15433:15433"
    command: ["-host=0.0.0.0"]
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  toxiproxy-setup:
    image: curlimages/curl:8.14.1
    depends_on:
      toxiproxy:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        curl -fsS http://toxiproxy:8474/proxies/cassandra >/dev/null ||
        curl -fsS -X POST -H 'Content-Type: application/json'
        --data '{"name":"cassandra","listen":"0.0.0.0:9042","upstream":"cassandra:9042"}'
        http://toxiproxy:8474/proxies;
        curl -fsS http://toxiproxy:8474/proxies/scheduler-postgres >/dev/null ||
        curl -fsS -X POST -H 'Content-Type: application/json'
        --data '{"name":"scheduler-postgres","listen":"0.0.0.0:15432","upstream":"scheduler-postgres:5432"}'
        http://toxiproxy:8474/proxies;
        curl -fsS http://toxiproxy:8474/proxies/edr-postgres >/dev/null ||
        curl -fsS -X POST -H 'Content-Type: application/json'
        --data '{"name":"edr-postgres","listen":"0.0.0.0:15433","upstream":"edr-postgres:5432"}'
        http://toxiproxy:8474/proxies

  scheduler-api:
    profiles: ["apps"]
    build: .
    command: ["job-visibility-api", "scheduler", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      scheduler-postgres:
        condition: service_healthy
    environment:
      SCHEDULER_DATABASE_URL: postgresql+psycopg://scheduler_owner:scheduler-local@scheduler-postgres:5432/scheduler
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  visibility-api:
    profiles: ["apps"]
    build: .
    command: ["job-visibility-api", "visibility", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      edr-postgres:
        condition: service_healthy
    environment:
      EDR_DATABASE_URL: postgresql+psycopg://edr_reader:edr-reader-local@edr-postgres:5432/edr
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  scheduler-worker:
    profiles: ["apps"]
    build: .
    command: ["job-visibility-runtime", "scheduler"]
    depends_on:
      scheduler-postgres:
        condition: service_healthy
    environment:
      SCHEDULER_DATABASE_URL: postgresql+psycopg://scheduler_owner:scheduler-local@scheduler-postgres:5432/scheduler
      SCHEDULER_WORKER_OWNER: compose-worker

  outbox-publisher:
    profiles: ["apps"]
    build: .
    command: ["job-visibility-runtime", "publisher"]
    depends_on:
      scheduler-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      SCHEDULER_DATABASE_URL: postgresql+psycopg://scheduler_owner:scheduler-local@scheduler-postgres:5432/scheduler
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081

  projector:
    profiles: ["apps"]
    build: .
    command: ["job-visibility-runtime", "projector"]
    depends_on:
      edr-postgres:
        condition: service_healthy
    environment:
      EDR_DATABASE_URL: postgresql+psycopg://edr_owner:edr-local@edr-postgres:5432/edr

volumes:
  scheduler-postgres-data:
  edr-postgres-data:
  kafka-data:
  cassandra-data:
